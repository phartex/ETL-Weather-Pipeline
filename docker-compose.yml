version: "3.8"

services:

  postgres:
    image: postgres:15
    container_name: airflow-postgres

    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow

    ports:
      - "5432:5432"
    
    volumes:
      - postgres_data:/var/lib/postgresql/data
    
volumes:
  postgres_data:

  airflow-init:
    image: apache/airflow:2.10.0

    depends_on:
      - postgres

    env_file:
      - .env

    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      PYTHONPATH: /opt/airflow

    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./data:/opt/airflow/data
      - ./logs:/opt/airflow/logs
      - ./.env:/opt/airflow/.env

    command: >
      bash -c "
      pip install pandas requests python-dotenv &&
      airflow db migrate &&
      airflow users create
      --username admin
      --firstname Victor
      --lastname Fateru
      --role Admin
      --email admin@example.com
      --password admin
      "

  airflow-webserver:
    image: apache/airflow:2.10.0

    container_name: airflow-webserver

    restart: always

    depends_on:
      - airflow-init

    ports:
      - "8080:8080"

    env_file:
      - .env

    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      PYTHONPATH: /opt/airflow

    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./data:/opt/airflow/data
      - ./logs:/opt/airflow/logs
      - ./.env:/opt/airflow/.env

    command: >
      bash -c "
      pip install pandas requests python-dotenv &&
      airflow webserver
      "

  airflow-scheduler:
    image: apache/airflow:2.10.0

    container_name: airflow-scheduler

    restart: always

    depends_on:
      - airflow-webserver

    env_file:
      - .env

    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      PYTHONPATH: /opt/airflow

    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./data:/opt/airflow/data
      - ./logs:/opt/airflow/logs
      - ./.env:/opt/airflow/.env

    command: >
      bash -c "
      pip install pandas requests python-dotenv &&
      airflow scheduler
      "